name: news
on:
  schedule:
    - cron: "7 * * * *"    # 每小时一次轻量检查,只有重要条目才推送
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL || 'gemini-flash-lite-latest,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.5-flash' }}
      BARK_KEY: ${{ secrets.BARK_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python news.py
      - name: commit
        if: always()
        run: |
          git config user.name "study-bot"
          git config user.email "study-bot@users.noreply.github.com"
          git add state || true
          git diff --cached --quiet || (git commit -m "news $(date +%F-%H)" && git pull --rebase -q && git push)
